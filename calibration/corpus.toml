# World corpus manifest for corpus-calibration artifact generation.
#
# Each [[repos]] entry is a permissive-license, active, real-world project.
# SHA pins the default-branch HEAD at time of manifest authorship; update by
# re-running: gh api repos/OWNER/REPO/commits/HEAD --jq .sha
#
# To regenerate the embedded calibration artifact from this manifest:
#
#   codelore calibrate \
#     --repos calibration/corpus.toml \
#     --vintage world-2026-07 \
#     --output crates/codelore-lib/src/calibration/world.calib.json
#
# The resulting artifact contains only quantile breakpoints — no source code,
# no user data. Permissive licensing is a courtesy posture: only aggregated
# numeric distributions are retained, so license exposure is minimal, but we
# still prefer repos whose authors have clearly granted broad reuse rights.
#
# Tier-1 languages: rust, python, java, javascript, typescript.
# A repo that is genuinely polyglot may list multiple languages; single-language
# anchors are preferred for cleaner signal.

