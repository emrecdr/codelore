# Keeps the GitHub Actions versions in `.github/workflows/*.yml` fresh.
# Without this, action major versions drift across the workflows over time
# (we hit v4→v6/v7/v8 jumps during the v0.1.0 release pipeline rebuild).
#
# Weekly cadence + grouped PRs means at most one bump-bundle PR per week,
# with all action updates batched together for a single review pass.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    # `dtolnay/rust-toolchain` is a special-case action whose `@<version>` tag
    # specifies the Rust toolchain to install (not the action's own version).
    # The dtolnay repo carries branches for future Rust versions before they
    # ship as stable — Dependabot reads them as "newer releases" and offers
    # bumps to versions that don't actually exist on the stable channel yet
    # (e.g. PR #1: 1.96.0 → 1.100.0, while stable was still 1.96.0). Bumping
    # the action tag also has to be coordinated with `rust-toolchain.toml`
    # and `Cargo.toml`'s `rust-version` to take effect — see
    # `scripts/cut-release.sh` for the coordinated path. Ignore Dependabot
    # bumps for this one action; the coordinated bump happens deliberately
    # at release-cut time.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    # Wait out the window in which a freshly-published compromised release
    # gets caught and yanked before any bot pulls it in. GitHub defaults to
    # a silent 3-day cooldown; stating it explicitly makes the policy
    # auditable and tunable. Security updates bypass cooldown by design, so
    # this delays convenience bumps only, never CVE fixes.
    cooldown:
      default-days: 7

  # Cargo lockfile + crate versions. Same grouping rationale.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust
    # tree-sitter ecosystem: the language grammars (`tree-sitter-{rust,python,
    # javascript,typescript,java}`) compile against a specific `tree-sitter`
    # core ABI, and `codelore-rca`'s `language_*.rs` node-ID enum tables are
    # generated against specific grammar versions. Bumping ANY single grammar
    # without coordinating the core + all peers would either fail to load
    # grammars (ABI mismatch) or silently produce wrong complexity metrics
    # (renumbered node IDs). The coordinated bump is a deliberate multi-day
    # effort, not weekly Dependabot churn.
    ignore:
      - dependency-name: "tree-sitter"
      - dependency-name: "tree-sitter-*"
    # Same rationale as the github-actions cooldown above, tuned for crates:
    # the registry-side equivalent (Cargo's own min-publish-age) is not yet
    # enforceable client-side, so the bot-side wait is the available lever.
    # Majors wait longest — they carry the most new code and the least
    # scrutiny overlap with the previous release. Security updates bypass
    # cooldown by design.
    cooldown:
      default-days: 5
      semver-major-days: 15

  # Docker / container-image digests are NOT handled here, and cannot
  # be: Dependabot's `docker` ecosystem only detects `Dockerfile` /
  # `*.Dockerfile` and skips files named `Containerfile` (the
  # OCI-canonical name we use). `renovate.json` configures Renovate's
  # `dockerfile` manager, which does read it — but the Renovate app is
  # not installed on this repository, so that config has never run and
  # no bot has ever opened a digest-bump PR. Base-image digests are
  # therefore maintained by hand; see the `Updating:` note in
  # `Containerfile`. Installing the Renovate app is what closes this,
  # and it would also cover `rust-toolchain.toml` via Renovate's
  # native `rust-toolchain` manager — the gap that let the pinned
  # toolchain sit on a patch release with a known miscompilation.
