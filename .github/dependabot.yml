# Keeps the GitHub Actions versions in `.github/workflows/*.yml` fresh.
# Without this, action major versions drift across the workflows over time
# (we hit v4→v6/v7/v8 jumps during the v0.1.0 release pipeline rebuild).
#
# Weekly cadence + grouped PRs means at most one bump-bundle PR per week,
# with all action updates batched together for a single review pass.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    # `dtolnay/rust-toolchain` is a special-case action whose `@<version>` tag
    # specifies the Rust toolchain to install (not the action's own version).
    # The dtolnay repo carries branches for future Rust versions before they
    # ship as stable — Dependabot reads them as "newer releases" and offers
    # bumps to versions that don't actually exist on the stable channel yet
    # (e.g. PR #1: 1.96.0 → 1.100.0, while stable was still 1.96.0). Bumping
    # the action tag also has to be coordinated with `rust-toolchain.toml`
    # and `Cargo.toml`'s `rust-version` to take effect — see
    # `scripts/cut-release.sh` for the coordinated path. Ignore Dependabot
    # bumps for this one action; the coordinated bump happens deliberately
    # at release-cut time.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"

  # Cargo lockfile + crate versions. Same grouping rationale.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust
    # tree-sitter ecosystem: the language grammars (`tree-sitter-{rust,python,
    # javascript,typescript,java,kotlin-ng,mozcpp,...}`) compile against a
    # specific `tree-sitter` core ABI, and `codelore-rca`'s `language_*.rs`
    # node-ID enum tables are generated against specific grammar versions.
    # Bumping ANY single grammar without coordinating the core + all peers
    # would either fail to load grammars (ABI mismatch) or silently produce
    # wrong complexity metrics (renumbered node IDs). PRs #2-4, #6 were all
    # closed for this reason. The coordinated bump is a deliberate multi-day
    # effort, not weekly Dependabot churn.
    #
    # petgraph: 0.6 → 0.8 is a 2-major bump with known API breaks in the
    # call-sites we exercise (clone-coupling graph algorithms). Deliberate
    # manual bump only.
    ignore:
      - dependency-name: "tree-sitter"
      - dependency-name: "tree-sitter-*"
      - dependency-name: "bca-tree-sitter-*"
      - dependency-name: "petgraph"

  # Docker / container-image digests are handled by Renovate (not
  # Dependabot) because Dependabot's `docker` ecosystem only detects
  # `Dockerfile` / `*.Dockerfile` and skips files named `Containerfile`
  # (the OCI-canonical name we use). Renovate's `dockerfile` manager
  # picks Containerfile up natively. See `renovate.json` for the
  # docker package rule.
