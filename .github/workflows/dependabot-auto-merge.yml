name: Dependabot auto-merge

# Keeps routine dependency PRs from piling up without ever merging ahead of
# CI. The repository requires no status checks at the platform layer, so a
# bare `gh pr merge --auto` would merge instantly; instead the merge happens
# in two stages:
#
#   1. `mark-eligible` (pull_request_target, trusted definition from main):
#      patch and minor Dependabot updates get the `dependabot-automerge`
#      label. MAJOR bumps are deliberately NOT labeled — they can carry
#      breaking API changes (e.g. arrow desyncing from duckdb's pinned
#      arrow, or a gix major that diverges the two Repo backends) and need
#      a human to review + adapt code. Those still open as normal PRs for
#      manual handling.
#   2. `merge-on-green` (workflow_run): fires only when the CI workflow
#      completes SUCCESSFULLY on a `dependabot/*` branch, finds the open
#      labeled PR for that head SHA, and squash-merges it. A red, cancelled,
#      or absent CI run can never merge anything.
#
# Neither stage checks out or executes PR code.

on:
  pull_request_target:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  mark-eligible:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Label patch + minor updates for merge-on-green
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh label create dependabot-automerge \
            --description "Dependabot update eligible to merge once CI is green" \
            --color 0E8A16 --repo "$REPO" || true
          gh pr edit "$PR_URL" --add-label dependabot-automerge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}

  merge-on-green:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      - name: Squash-merge the labeled PR for this green head
        run: |
          # .head.sha must still equal the SHA CI validated: if Dependabot
          # force-pushed meanwhile, this green run is stale and must not
          # merge the moved PR (its own fresh CI run will handle it).
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq --arg sha "$HEAD_SHA" \
            '[.[] | select(.user.login == "dependabot[bot]"
                           and .state == "open"
                           and .head.sha == $sha
                           and ([.labels[].name] | index("dependabot-automerge") != null))]
             | first | .number // empty')
          if [ -n "$pr" ]; then
            gh pr merge "$pr" --squash --delete-branch --repo "$REPO"
          else
            echo "no open labeled Dependabot PR for $HEAD_SHA — nothing to merge"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
