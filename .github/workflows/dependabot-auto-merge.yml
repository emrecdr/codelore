name: Dependabot auto-merge

# Keeps routine dependency PRs from piling up without ever merging ahead of
# CI. The repository requires no status checks at the platform layer, so a
# bare `gh pr merge --auto` would merge instantly; instead the merge happens
# in two stages:
#
#   1. `mark-eligible` (pull_request_target, trusted definition from main):
#      patch and minor Dependabot updates get the `dependabot-automerge`
#      label. MAJOR bumps are deliberately NOT labeled — they can carry
#      breaking API changes (e.g. arrow desyncing from duckdb's pinned
#      arrow, or a gix major that diverges the two Repo backends) and need
#      a human to review + adapt code. Those still open as normal PRs for
#      manual handling.
#   2. `merge-on-green` (workflow_run): fires only when the CI workflow
#      completes SUCCESSFULLY on a `dependabot/*` branch, finds the open
#      labeled PR for that head SHA, and squash-merges it. A red, cancelled,
#      or absent CI run can never merge anything.
#
# Neither stage checks out or executes PR code.

# Both triggers are inherent to Dependabot auto-merge and are mitigated the
# documented way, in the header above: neither stage checks out or executes
# pull-request code. The danger `pull_request_target` carries is running
# untrusted code with a privileged token; nothing here runs it.
on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
  workflow_run:
    workflows: [CI]
    types: [completed]

# These three are what auto-merge is: approving and merging a pull request,
# and re-dispatching CI on main afterwards. They cannot be narrowed without
# removing the capability. They are workflow-level because both jobs need
# them, and the workflow contains nothing else.
permissions:
  contents: write        # zizmor: ignore[excessive-permissions]
  pull-requests: write   # zizmor: ignore[excessive-permissions]
  # merge-on-green re-dispatches main's CI after a merge (see below).
  actions: write         # zizmor: ignore[excessive-permissions]

jobs:
  mark-eligible:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Label patch + minor updates for merge-on-green
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh label create dependabot-automerge \
            --description "Dependabot update eligible to merge once CI is green" \
            --color 0E8A16 --repo "$REPO" || true
          gh pr edit "$PR_URL" --add-label dependabot-automerge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}

  merge-on-green:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      - name: Squash-merge the labeled PR for this green head
        run: |
          # .head.sha must still equal the SHA CI validated: if Dependabot
          # force-pushed meanwhile, this green run is stale and must not
          # merge the moved PR (its own fresh CI run will handle it).
          # gh api's --jq flag takes only the query (no --arg), so the JSON
          # goes through the real jq binary to keep the SHA out of the
          # query string.
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" |
            jq -r --arg sha "$HEAD_SHA" \
            '[.[] | select(.user.login == "dependabot[bot]"
                           and .state == "open"
                           and .head.sha == $sha
                           and ([.labels[].name] | index("dependabot-automerge") != null))]
             | first | .number // empty')
          if [ -n "$pr" ]; then
            gh pr merge "$pr" --squash --delete-branch --repo "$REPO"
            # A push made with GITHUB_TOKEN does not fire on:push workflows
            # (recursion guard), so the merge commit would land on main with
            # no CI — no self-gate stamp, no dogfood demo publish. Explicit
            # workflow_dispatch is exempt from the guard; dispatch main's CI
            # so auto-merged commits get the same coverage as every other.
            gh workflow run ci.yml --ref main --repo "$REPO"
          else
            echo "no open labeled Dependabot PR for $HEAD_SHA — nothing to merge"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
