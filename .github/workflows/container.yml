name: container

on:
  push:
    # `v*.*.*`, NOT `v*` — see the note in release.yml. The Action's floating
    # major tag `v1` is a `v*` tag that moves on every release, and under
    # `v*` that push triggered a duplicate container build and publish.
    tags: ['v*.*.*']
  # Manual re-run of a release publish that failed after the tag was pushed.
  # Dispatch it FROM THE TAG, not from a branch: every job here is gated on
  # `github.ref_type == 'tag'` and a branch dispatch skips the whole
  # workflow rather than publishing.
  #
  # Without that gate a branch dispatch published for real. `type=sha` is the
  # only tag rule that matches a non-tag ref, so the run produced a genuine,
  # publicly pullable, attested `sha-<short>` image from unreleased code —
  # quietly, because nothing else about the run looked like a release. The
  # same shape as the `release.yml` dispatch that was documented as a dry run
  # and published a GitHub Release plus a Homebrew formula.
  workflow_dispatch:

# Cancel any superseded run for the same tag — see release.yml for context.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Three-phase multi-arch build:
#   1. `build` matrix runs ONE job per architecture on a NATIVE runner
#      (ubuntu-latest for amd64, ubuntu-24.04-arm for arm64). Each job builds
#      its own platform-specific image, pushes by digest only (no tags), and
#      uploads the digest as an artifact.
#   2. `merge` job downloads all per-arch digests and assembles them into a
#      single multi-arch manifest list with the user-facing tags, then
#      reports the digest the registry assigned as a job output.
#   3. `attest` job signs that digest via the reusable trusted signer at
#      .github/workflows/attest-digest.yml.
#
# Phase 3 is separate because building the image executes the Containerfile's
# `RUN` steps — repository-authored code. Under SLSA v1.0 Build L3 the
# sigstore signing token must be unreachable from any job running such code,
# so neither `build` nor `merge` may hold it. See attest-digest.yml.
#
# Rationale: QEMU-emulated arm64 builds of Rust workspaces are pathologically
# slow (~2.5 hours when they don't hang) and trigger rustup `EFAULT (Bad
# address)` errors during toolchain extraction. Native arm64 runners are
# available, free for public repos, and finish in ~7 minutes.

# Jobs declare every scope they use; the workflow-level default grants
# nothing, so a future job starts from zero instead of the platform default.
permissions: {}

jobs:
  build:
    # Publishing is a tag-ref property, not a trigger property: a dispatch
    # from a tag is the legitimate retry path and still publishes, while a
    # dispatch from a branch skips. `merge` and `attest` follow through
    # `needs:`, so this one condition gates the whole pipeline — but each is
    # stated on its own job anyway, because a publish gate that depends on
    # dependency-graph semantics is one `needs:` edit away from silently
    # re-opening.
    if: github.ref_type == 'tag'
    # 25 was never comfortable: the amd64 leg finished 43s under it on one
    # release and 1m55s under it on the next, so two of the last three
    # publishes passed on margin thinner than normal runner variance, and the
    # third exceeded it on both architectures and both attempts. A job-level
    # timeout breach is reported as `cancelled`, not `failure`, which is why
    # the symptom read as an infrastructure cancellation rather than the
    # deterministic wall it actually is. This value is a hang guard, not a
    # performance budget — it wants enough headroom that only a genuinely
    # stuck build reaches it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # No signing permissions. This job executes the Containerfile's `RUN`
    # steps — repository-authored code — so under SLSA Build L3 the sigstore
    # token must be unreachable from here. Signing happens in `attest`.
    # Do not add id-token/attestations back.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          push: true
          # Pass the canonical owner/repo slug to the Containerfile's
          # REPO build-arg so `org.opencontainers.image.source` resolves
          # to the actual GitHub repo URL (clients dereferencing the OCI
          # label via `docker inspect` / cosign / Snyk get a working
          # URL, not a literal placeholder). `github.repository` is
          # the workflow's owner/repo slug — fork builds get
          # fork-correct labels for free.
          build-args: |
            REPO=${{ github.repository }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          sbom: true
          provenance: mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # Consumed by `attest`. The registry — not this workflow — is the
      # authority on the manifest-list digest, so it is read back after
      # creation rather than recomputed locally.
      digest: ${{ steps.manifest.outputs.digest }}
    # Assembles manifests only; still no signing permissions, so the token
    # lives in exactly one job across this workflow.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Create multi-arch manifest
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          # Capture the manifest-list digest the registry assigned, used for
          # the build-provenance attestation below.
          first_tag=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          manifest_digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${manifest_digest}" >> "$GITHUB_OUTPUT"

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

  # Trusted signer — the only job in this workflow permitted to sign. It
  # runs no repository-authored code, which is what satisfies SLSA Build L3.
  attest:
    needs: merge
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/attest-digest.yml
    with:
      subject-name: ghcr.io/${{ github.repository }}
      subject-digest: ${{ needs.merge.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
