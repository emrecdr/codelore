name: container

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Cancel any superseded run for the same tag — see release.yml for context.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two-phase multi-arch build:
#   1. `build` matrix runs ONE job per architecture on a NATIVE runner
#      (ubuntu-latest for amd64, ubuntu-24.04-arm for arm64). Each job builds
#      its own platform-specific image, pushes by digest only (no tags), and
#      uploads the digest as an artifact.
#   2. `merge` job downloads all per-arch digests and assembles them into a
#      single multi-arch manifest list with the user-facing tags, then
#      attests provenance against the manifest digest.
#
# Rationale: QEMU-emulated arm64 builds of Rust workspaces are pathologically
# slow (~2.5 hours when they don't hang) and trigger rustup `EFAULT (Bad
# address)` errors during toolchain extraction. Native arm64 runners are
# available, free for public repos, and finish in ~7 minutes.

jobs:
  build:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      # Populate vendor/ on the host before docker buildx sends the build
      # context. Workspace Cargo.toml's `[patch.crates-io]` block points at
      # `vendor/duckdb-rs/...` (workaround for upstream duckdb-rs#786 — MSVC
      # 19.40 build break). `cargo` errors when the patch path is missing,
      # so the directory must be in the docker context for `COPY . .` inside
      # the planner stage to pick it up. Idempotent; the script no-ops if
      # the stamp file matches the pinned upstream tag.
      - name: Vendor patched libduckdb-sys (duckdb-rs#786)
        run: bash scripts/vendor-duckdb-rs.sh

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          push: true
          # F99 fix: pass the canonical owner/repo slug through to the
          # Containerfile's REPO build-arg so the
          # `org.opencontainers.image.source` label resolves to the
          # actual GitHub repo (was previously a literal `<owner>`
          # placeholder, breaking `docker inspect` / cosign / Snyk).
          # `github.repository` is the `owner/repo` slug the workflow
          # ran from, so fork builds get fork-correct labels for free.
          build-args: |
            REPO=${{ github.repository }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          sbom: true
          provenance: mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Create multi-arch manifest
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          # Capture the manifest-list digest the registry assigned, used for
          # the build-provenance attestation below.
          first_tag=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          manifest_digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${manifest_digest}" >> "$GITHUB_OUTPUT"

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
