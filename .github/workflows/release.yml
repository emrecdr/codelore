# Release pipeline for CodeLore — multi-platform binaries with per-artifact
# SLSA v1.0 build provenance attestations.
#
# Attestation pattern: each matrix job runs `actions/attest-build-provenance@v4`
# on its own staged artifact AFTER staging but BEFORE upload. The action signs
# via sigstore OIDC and pushes the attestation to GitHub's transparency log;
# `gh attestation verify codelore-<tag>-<target>.tar.gz --owner emrecdr`
# confirms provenance against the public Rekor entry.
#
# Earlier attempts at SLSA L3 via slsa-framework/slsa-github-generator's
# reusable workflow failed because that pattern aggregates `outputs.hashes`
# across the build matrix into a single `base64-subjects` input — and
# GitHub Actions only preserves the LAST matrix job's outputs, so 4 of 5
# subject hashes were silently dropped. The per-job v4 attestation flow
# eliminates the aggregation step entirely.
#
# Triggered by:
#   - Tag push matching `v*` (canonical release path)
#   - Manual workflow_dispatch (test runs)

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Cancel any superseded run for the same tag. Without this, retags during
# debugging produce a fan of zombie queued runs that compete for the same
# scarce runner pools (notably macos).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write       # create the GitHub Release + upload artifacts
  id-token: write       # OIDC token for sigstore attestation signing
  attestations: write   # write attestations to the sigstore transparency log

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    timeout-minutes: 45
    # Compile caching relies on the actions/cache step below (warms
    # ~/.cargo + target). No sccache: its GitHub-cache backend shares
    # the repo's 10 GB Actions-cache quota and, once the quota is
    # exceeded, rejected writes turn the wrapper into a pure per-unit
    # network tax — slowest exactly where release builds hurt most,
    # the cold windows target.
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 (Sequoia, aarch64) is the GitHub-default macOS runner
          # since mid-2025. Cross-compiles x86_64-apple-darwin via Apple's
          # bundled cross-target SDK. (macos-13 is deprecated and queues
          # indefinitely; macos-14 still works but is the prior stable.)
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write       # per-job OIDC token for sigstore signing
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Include rust-toolchain.toml in the cache key so a Rust
          # toolchain bump invalidates cached artifacts. The rustc
          # version is part of every .rmeta / .rlib hash; carrying
          # stale artifacts across a toolchain bump produces cryptic
          # linker errors that get misdiagnosed as flaky CI.
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build release binary
        # `--features spa` activates the opt-in dashboard emitter
        # (`--format spa`). Released binaries ship with this enabled
        # so end-users get the dashboard out of the box; source
        # installs (`cargo install codelore`) default OFF.
        # See `crates/codelore-lib/build.rs` for the JS-dep fetch.
        run: cargo build --release -p codelore-cli --target ${{ matrix.target }} --features spa

      - name: Stage artifact
        id: stage
        shell: bash
        # Every artifact ships GPL-3.0-only LICENSE, the MPL-2.0 notice
        # for the vendored codelore-rca fork (renamed to avoid ambiguity
        # with LICENSE), and the NOTICE file summarizing both. All three
        # are staged into a scratch directory alongside the binary (and,
        # on Windows, README/CHANGELOG) so tar and 7z can pack them with
        # plain relative names — no path traversal or cross-directory
        # arguments.
        run: |
          mkdir -p dist
          archive_name="codelore-${{ needs.plan.outputs.tag }}-${{ matrix.target }}"
          stage_dir="dist/stage"
          mkdir -p "$stage_dir"
          cp LICENSE "$stage_dir/LICENSE"
          cp crates/codelore-rca/LICENSE-MPL "$stage_dir/LICENSE-MPL-codelore-rca"
          cp NOTICE "$stage_dir/NOTICE"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/codelore.exe" "$stage_dir/codelore.exe"
            cp README.md "$stage_dir/README.md"
            cp CHANGELOG.md "$stage_dir/CHANGELOG.md"
            (cd "$stage_dir" && 7z a "../${archive_name}.zip" codelore.exe README.md CHANGELOG.md LICENSE LICENSE-MPL-codelore-rca NOTICE 2>/dev/null || true)
            echo "archive=dist/${archive_name}.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/codelore" "$stage_dir/codelore"
            tar -C "$stage_dir" -czf "dist/${archive_name}.tar.gz" codelore LICENSE LICENSE-MPL-codelore-rca NOTICE
            echo "archive=dist/${archive_name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          rm -rf "$stage_dir"

      # SLSA v1.0 build provenance for this matrix entry's artifact. The
      # action signs with the runner's OIDC token, publishes the attestation
      # to the sigstore Rekor transparency log, and (because we set
      # `subject-path`) anchors the attestation to the artifact's content
      # hash. Consumers verify via:
      #   gh attestation verify <archive> --owner emrecdr
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: ${{ steps.stage.outputs.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: codelore-${{ matrix.target }}
          path: dist/

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Create / update GitHub Release
        # SHA-pin to the exact `v3.0.0` commit. The `@v3` tag is mutable
        # upstream — the action repo could re-point it to a malicious
        # commit and CI would silently pick it up on the next tag push.
        # This action runs with GITHUB_TOKEN write access to create /
        # update Releases and (via the homebrew-publish dependency
        # chain) indirectly the homebrew-codelore tap, so a compromise
        # here surfaces as forged release artifacts. SHA pinning gives
        # up Dependabot auto-bumps but for a critical release-pipeline
        # action that's the right trade.
        #
        # Bump procedure when softprops ships a v3.x.y update:
        #   1. gh api repos/softprops/action-gh-release/git/refs/tags/v3 --jq .object.sha
        #   2. confirm the new SHA against the upstream release notes
        #      (https://github.com/softprops/action-gh-release/releases)
        #   3. replace the SHA below + update the trailing `# v3.x.y` tag.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          files: dist/**
          fail_on_unmatched_files: true

  # Regenerate emrecdr/homebrew-codelore/Formula/codelore.rb on every v* tag.
  # SHAs computed from the workflow's own upload-artifact storage (NOT the
  # public Release URL) so there's no CDN-propagation race after `release`
  # publishes. The artifact files are bit-identical to the Release assets,
  # so the SHA256 matches what end-users download via `brew install`.
  homebrew-publish:
    needs: [plan, build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Render Formula/codelore.rb
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          sha() { sha256sum "dist/$1" | awk '{print $1}'; }
          ARM_MAC=$(sha "codelore-${TAG}-aarch64-apple-darwin.tar.gz")
          INTEL_MAC=$(sha "codelore-${TAG}-x86_64-apple-darwin.tar.gz")
          ARM_LIN=$(sha "codelore-${TAG}-aarch64-unknown-linux-gnu.tar.gz")
          INTEL_LIN=$(sha "codelore-${TAG}-x86_64-unknown-linux-gnu.tar.gz")

          cat > codelore.rb <<RUBY
          class Codelore < Formula
            desc "Behavioral code analysis CLI — code-maat compatible, written in Rust"
            homepage "https://github.com/${{ github.repository }}"
            version "${VERSION}"
            license "GPL-3.0-only"

            on_macos do
              on_arm do
                url "${BASE}/codelore-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM_MAC}"
              end
              on_intel do
                url "${BASE}/codelore-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${INTEL_MAC}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE}/codelore-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${ARM_LIN}"
              end
              on_intel do
                url "${BASE}/codelore-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${INTEL_LIN}"
              end
            end

            def install
              bin.install "codelore"
            end

            test do
              assert_match "codelore #{version}", shell_output("#{bin}/codelore --version")
            end
          end
          RUBY

      - name: Check out tap (deploy-key auth)
        uses: actions/checkout@v7
        with:
          repository: emrecdr/homebrew-codelore
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Commit and push regenerated formula
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp codelore.rb tap/Formula/codelore.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/codelore.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged for ${TAG}; skipping push."
            exit 0
          fi
          git commit -m "codelore ${TAG#v}"
          git push
