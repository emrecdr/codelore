# Release pipeline for CodeLore — multi-platform binaries with per-artifact
# SLSA v1.0 Build L3 provenance attestations.
#
# Attestation pattern: `build` compiles and uploads, and signs NOTHING. A
# separate `attest` job — a matrix over the same targets, calling the
# reusable workflow at .github/workflows/attest-artifact.yml — downloads
# each artifact, hashes it, and signs it via sigstore OIDC.
#
# That separation is the L3 requirement itself, not a style choice:
# `cargo build` executes `build.rs`, so the build job runs
# repository-authored code and therefore must not hold the signing token.
# It is granted `contents: read` and nothing more. See attest-artifact.yml
# for the full rationale.
#
# Consumers verify against the pinned signer identity:
#   gh attestation verify codelore-<tag>-<target>.tar.gz --owner emrecdr \
#     --signer-workflow emrecdr/codelore/.github/workflows/attest-artifact.yml
#
# Earlier attempts at L3 via slsa-framework/slsa-github-generator's
# reusable workflow failed because that pattern aggregates `outputs.hashes`
# across the build matrix into a single `base64-subjects` input — and
# GitHub Actions only preserves the LAST matrix job's outputs, so 4 of 5
# subject hashes were silently dropped. Attesting each artifact in its own
# job removes the aggregation entirely: no digest crosses a job boundary.
#
# Triggered by:
#   - Tag push matching `v*` (canonical release path — everything runs)
#   - Manual workflow_dispatch (dry run: plan/build/attest only)
#
# On workflow_dispatch the three publishing jobs are skipped by their own
# `if: github.ref_type == 'tag'`, so a manual run exercises compilation,
# packaging, and the full attestation path without creating a GitHub
# Release, touching the Homebrew tap, or publishing to crates.io. It does
# write real attestations for the throwaway archives — they are digest-bound
# and harmless, and signing is the part most worth exercising.

name: release

on:
  push:
    # `v*.*.*`, NOT `v*` — the Action's floating major tag `v1` is also a
    # `v*` tag, and it is re-pointed on every release. Under `v*` that push
    # triggered a second, bogus release run: it published a GitHub Release
    # literally named `v1`, which made the `releases/latest` API return `v1`,
    # which the Action's own `version: latest` resolution then rejected as
    # not-a-semver — breaking the published Action for every consumer. This
    # pattern still matches every real release tag, pre-release suffixes
    # included (v0.27.2, v1.0.0-rc.1), and matches no bare major.
    tags: ['v*.*.*']
  workflow_dispatch:

# Cancel any superseded run for the same tag. Without this, retags during
# debugging produce a fan of zombie queued runs that compete for the same
# scarce runner pools (notably macos).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level default. Signing permissions are deliberately ABSENT: only
# the `attest` job may hold them, and it declares them on its own
# reusable-workflow call. Keeping them out of the default means a job added
# to this file later cannot silently inherit the ability to sign provenance.
permissions:
  contents: write       # create the GitHub Release + upload artifacts

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        # Ref name and type reach the shell through the environment rather
        # than through an inline expression, which would be substituted into
        # the script text before bash parses it. `git check-ref-format`
        # permits far more than it looks like it does — this repository
        # already has a finding about a `|` in a tag name — so a tag is
        # untrusted input to a shell, and a release job is the worst place to
        # learn that.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    timeout-minutes: 45
    # Compile caching relies on the actions/cache step below (warms
    # ~/.cargo + target). No sccache: its GitHub-cache backend shares
    # the repo's 10 GB Actions-cache quota and, once the quota is
    # exceeded, rejected writes turn the wrapper into a pure per-unit
    # network tax — slowest exactly where release builds hurt most,
    # the cold windows target.
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 (Sequoia, aarch64) is the GitHub-default macOS runner
          # since mid-2025. Cross-compiles x86_64-apple-darwin via Apple's
          # bundled cross-target SDK. (macos-13 is deprecated and queues
          # indefinitely; macos-14 still works but is the prior stable.)
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    # Read-only by design. This job runs `cargo build`, which executes
    # `build.rs` — repository-authored code — so under SLSA Build L3 the
    # sigstore signing token must be unreachable from here. Signing happens
    # in the `attest` job below. Do not add id-token/attestations back.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Include rust-toolchain.toml in the cache key so a Rust
          # toolchain bump invalidates cached artifacts. The rustc
          # version is part of every .rmeta / .rlib hash; carrying
          # stale artifacts across a toolchain bump produces cryptic
          # linker errors that get misdiagnosed as flaky CI.
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build release binary
        # `--features spa` activates the opt-in dashboard emitter
        # (`--format spa`). Released binaries ship with this enabled
        # so end-users get the dashboard out of the box; source
        # installs (`cargo install codelore`) default OFF.
        # See `crates/codelore-lib/build.rs` for the JS-dep fetch.
        run: cargo build --release -p codelore --target ${{ matrix.target }} --features spa

      - name: Stage artifact
        shell: bash
        # Every artifact ships GPL-3.0-only LICENSE, the MPL-2.0 notice
        # for the vendored codelore-rca fork (renamed to avoid ambiguity
        # with LICENSE), and the NOTICE file summarizing both. All three
        # are staged into a scratch directory alongside the binary (and,
        # on Windows, README/CHANGELOG) so tar and 7z can pack them with
        # plain relative names — no path traversal or cross-directory
        # arguments.
        run: |
          mkdir -p dist
          archive_name="codelore-${{ needs.plan.outputs.tag }}-${{ matrix.target }}"
          stage_dir="dist/stage"
          mkdir -p "$stage_dir"
          cp LICENSE "$stage_dir/LICENSE"
          cp crates/codelore-rca/LICENSE-MPL "$stage_dir/LICENSE-MPL-codelore-rca"
          cp NOTICE "$stage_dir/NOTICE"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/codelore.exe" "$stage_dir/codelore.exe"
            cp README.md "$stage_dir/README.md"
            cp CHANGELOG.md "$stage_dir/CHANGELOG.md"
            (cd "$stage_dir" && 7z a "../${archive_name}.zip" codelore.exe README.md CHANGELOG.md LICENSE LICENSE-MPL-codelore-rca NOTICE 2>/dev/null || true)
          else
            cp "target/${{ matrix.target }}/release/codelore" "$stage_dir/codelore"
            tar -C "$stage_dir" -czf "dist/${archive_name}.tar.gz" codelore LICENSE LICENSE-MPL-codelore-rca NOTICE
          fi
          rm -rf "$stage_dir"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: codelore-${{ matrix.target }}
          path: dist/

  # Trusted signer — the only job in this workflow permitted to sign.
  #
  # Runs the same target matrix as `build`, but each instance merely
  # downloads one artifact and attests it: no compilation, no
  # repository-authored code, nothing that could reach the OIDC token
  # except first-party actions. That is what satisfies SLSA Build L3.
  #
  # The matrix below must stay in sync with `build`'s targets — each value
  # names one upload-artifact entry. A target present in `build` but
  # missing here would ship UNATTESTED, so add to both or neither.
  attest:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
    uses: ./.github/workflows/attest-artifact.yml
    with:
      artifact-name: codelore-${{ matrix.target }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

  # Depends on `attest` as well as `build`: a failed attestation must block
  # publication rather than ship an unattested archive to the Release.
  #
  # Tag-gated so that `workflow_dispatch` is the dry run this file's header
  # claims it is. Unguarded, a manual run reached here with the `plan` job's
  # `manual-<timestamp>` fallback and published a real GitHub Release for it.
  # Guarded on each publishing job rather than relying on the skip cascading
  # through `needs:` — a later edit to a `needs:` list must not silently
  # re-enable publishing.
  release:
    if: github.ref_type == 'tag'
    needs: [plan, build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          # Checksum every published archive so consumers can verify their
          # download. The manifest itself is excluded by the archive globs
          # and is uploaded to the release by the `files: dist/**` glob below.
          # `nullglob` drops a non-matching glob rather than passing it
          # literally, so a future matrix that emits only one archive type
          # doesn't fail the step; guard against zero archives explicitly.
          archives=(codelore-*.tar.gz codelore-*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::no release archives found in dist/ to checksum"
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Create / update GitHub Release
        # SHA-pin to the exact `v3.0.0` commit. The `@v3` tag is mutable
        # upstream — the action repo could re-point it to a malicious
        # commit and CI would silently pick it up on the next tag push.
        # This action runs with GITHUB_TOKEN write access to create /
        # update Releases and (via the homebrew-publish dependency
        # chain) indirectly the homebrew-codelore tap, so a compromise
        # here surfaces as forged release artifacts. SHA pinning gives
        # up Dependabot auto-bumps but for a critical release-pipeline
        # action that's the right trade.
        #
        # Bump procedure when softprops ships a v3.x.y update:
        #   1. gh api repos/softprops/action-gh-release/git/refs/tags/v3 --jq .object.sha
        #   2. confirm the new SHA against the upstream release notes
        #      (https://github.com/softprops/action-gh-release/releases)
        #   3. replace the SHA below + update the trailing `# v3.x.y` tag.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          files: dist/**
          fail_on_unmatched_files: true

  # Regenerate emrecdr/homebrew-codelore/Formula/codelore.rb on every v* tag.
  # SHAs computed from the workflow's own upload-artifact storage (NOT the
  # public Release URL) so there's no CDN-propagation race after `release`
  # publishes. The artifact files are bit-identical to the Release assets,
  # so the SHA256 matches what end-users download via `brew install`.
  #
  # Tag-gated for the same reason as `release`: this job pushes to an external
  # repository, so a manual run would have pointed the public tap at a
  # throwaway build.
  homebrew-publish:
    if: github.ref_type == 'tag'
    needs: [plan, build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Render Formula/codelore.rb
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          sha() { sha256sum "dist/$1" | awk '{print $1}'; }
          ARM_MAC=$(sha "codelore-${TAG}-aarch64-apple-darwin.tar.gz")
          INTEL_MAC=$(sha "codelore-${TAG}-x86_64-apple-darwin.tar.gz")
          ARM_LIN=$(sha "codelore-${TAG}-aarch64-unknown-linux-gnu.tar.gz")
          INTEL_LIN=$(sha "codelore-${TAG}-x86_64-unknown-linux-gnu.tar.gz")

          cat > codelore.rb <<RUBY
          class Codelore < Formula
            desc "Behavioral code analysis CLI — code-maat compatible, written in Rust"
            homepage "https://github.com/${{ github.repository }}"
            version "${VERSION}"
            license "GPL-3.0-only"

            on_macos do
              on_arm do
                url "${BASE}/codelore-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM_MAC}"
              end
              on_intel do
                url "${BASE}/codelore-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${INTEL_MAC}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE}/codelore-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${ARM_LIN}"
              end
              on_intel do
                url "${BASE}/codelore-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${INTEL_LIN}"
              end
            end

            def install
              bin.install "codelore"
            end

            test do
              assert_match "codelore #{version}", shell_output("#{bin}/codelore --version")
            end
          end
          RUBY

      - name: Check out tap (deploy-key auth)
        uses: actions/checkout@v7
        with:
          repository: emrecdr/homebrew-codelore
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Commit and push regenerated formula
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp codelore.rb tap/Formula/codelore.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/codelore.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged for ${TAG}; skipping push."
            exit 0
          fi
          git commit -m "codelore ${TAG#v}"
          git push

  # Publishes the three workspace crates to crates.io in dependency order —
  # codelore-rca has no internal dependents, codelore-lib depends on it, and
  # codelore depends on codelore-lib — relying on `cargo publish` to wait for
  # each crate to propagate through the index before the next one starts.
  # The `secrets` context is not available in ANY `if` expression (job- or
  # step-level), so the token is mapped through job-level `env` and the
  # publish step's guard tests `env.CRATES_IO_TOKEN` instead. The publish
  # step is skipped (not the job) when the token is absent, so forks and
  # unconfigured checkouts still get a green release. It's also gated to
  # tag-triggered runs only: this workflow also runs on workflow_dispatch
  # test runs, and `cargo publish` is permanent (yank-only), so a manual
  # test run must never publish. Each publish is idempotent: the step
  # queries crates.io for the crate@version first and skips it when the
  # version is already live, so a re-run after a mid-sequence registry
  # hiccup completes the remaining crates in the same rca → lib → codelore
  # order without tripping over `cargo publish`'s already-exists rejection.
  # The job-level gate below makes a dry run skip this job outright rather
  # than spin up a runner to reach a step that will not fire. The step-level
  # condition stays: it also covers the unconfigured-token case, and a
  # publish that is permanent is worth guarding twice.
  crates-publish:
    if: github.ref_type == 'tag'
    needs: [plan, build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.96.0

      - name: Publish to crates.io
        if: ${{ github.ref_type == 'tag' && env.CRATES_IO_TOKEN != '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          # crates.io answers requests without a User-Agent with HTTP 403,
          # which would make the presence check silently fail-open and
          # re-attempt an already-published version — always send a UA.
          UA="codelore-release (github-actions)"
          publish_if_absent() {
            local crate="$1" version
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')"
            # Branch on the STATUS, not on curl's exit code. `-sSf` fails on
            # any non-2xx, so a transient 5xx or a timeout read as "not
            # published" and fell through to publish — and if the crate WAS
            # already there, `cargo publish` fails on "already exists" and
            # `set -e` aborts the job mid-sequence, which is the unrecoverable
            # state this idempotence check exists to prevent. Only a 404 means
            # absent; anything else unknown, so retry and then fail closed
            # rather than guessing.
            local status
            status="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 \
              --retry-all-errors -H "User-Agent: $UA" \
              "https://crates.io/api/v1/crates/${crate}/${version}" || echo 000)"
            case "$status" in
              200)
                echo "${crate} ${version} already on crates.io — skipping."
                ;;
              404)
                echo "Publishing ${crate} ${version}..."
                cargo publish -p "$crate"
                ;;
              *)
                echo "::error::crates.io returned ${status} for ${crate} ${version};" \
                  "cannot tell whether it is published. Refusing to publish blind —" \
                  "re-run this job once the registry is reachable."
                return 1
                ;;
            esac
          }
          publish_if_absent codelore-rca
          publish_if_absent codelore-lib
          publish_if_absent codelore
