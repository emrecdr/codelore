# Release pipeline for CodeLore — multi-platform binaries with per-artifact
# SLSA v1.0 build provenance attestations.
#
# Attestation pattern: each matrix job runs `actions/attest-build-provenance@v4`
# on its own staged artifact AFTER staging but BEFORE upload. The action signs
# via sigstore OIDC and pushes the attestation to GitHub's transparency log;
# `gh attestation verify codelore-<tag>-<target>.tar.gz --owner emrecdr`
# confirms provenance against the public Rekor entry.
#
# Earlier attempts at SLSA L3 via slsa-framework/slsa-github-generator's
# reusable workflow failed because that pattern aggregates `outputs.hashes`
# across the build matrix into a single `base64-subjects` input — and
# GitHub Actions only preserves the LAST matrix job's outputs, so 4 of 5
# subject hashes were silently dropped. The per-job v4 attestation flow
# eliminates the aggregation step entirely.
#
# Triggered by:
#   - Tag push matching `v*` (canonical release path)
#   - Manual workflow_dispatch (test runs)

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Cancel any superseded run for the same tag. Without this, retags during
# debugging produce a fan of zombie queued runs that compete for the same
# scarce runner pools (notably macos).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write       # create the GitHub Release + upload artifacts
  id-token: write       # OIDC token for sigstore attestation signing
  attestations: write   # write attestations to the sigstore transparency log

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 (Sequoia, aarch64) is the GitHub-default macOS runner
          # since mid-2025. Cross-compiles x86_64-apple-darwin via Apple's
          # bundled cross-target SDK. (macos-13 is deprecated and queues
          # indefinitely; macos-14 still works but is the prior stable.)
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write       # per-job OIDC token for sigstore signing
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release -p codelore-cli --target ${{ matrix.target }}

      - name: Stage artifact
        id: stage
        shell: bash
        run: |
          mkdir -p dist
          archive_name="codelore-${{ needs.plan.outputs.tag }}-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            (cd "target/${{ matrix.target }}/release" && 7z a "../../../dist/${archive_name}.zip" codelore.exe ../../../README.md ../../../CHANGELOG.md ../../../LICENSE 2>/dev/null || true)
            echo "archive=dist/${archive_name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -C "target/${{ matrix.target }}/release" -czf "dist/${archive_name}.tar.gz" codelore
            echo "archive=dist/${archive_name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      # SLSA v1.0 build provenance for this matrix entry's artifact. The
      # action signs with the runner's OIDC token, publishes the attestation
      # to the sigstore Rekor transparency log, and (because we set
      # `subject-path`) anchors the attestation to the artifact's content
      # hash. Consumers verify via:
      #   gh attestation verify <archive> --owner emrecdr
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.stage.outputs.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: codelore-${{ matrix.target }}
          path: dist/

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          files: dist/**
          fail_on_unmatched_files: true
