name: bench

on:
  schedule:
    - cron: '0 6 * * MON'  # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # bench results are timeline data; don't drop runs

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Include rust-toolchain.toml in the cache key so a Rust
          # toolchain bump invalidates cached artifacts. The rustc
          # version is part of every .rmeta / .rlib hash; carrying
          # stale artifacts across a toolchain bump produces cryptic
          # linker errors that get misdiagnosed as flaky CI.
          key: bench-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Vendor patched libduckdb-sys (duckdb-rs#786)
        run: bash scripts/vendor-duckdb-rs.sh

      - name: Cache Linux kernel snapshot
        id: kernel-cache
        uses: actions/cache@v5
        with:
          path: /tmp/linux-kernel-snapshot
          key: linux-kernel-snapshot-2026-06

      - name: Fetch Linux kernel snapshot
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=10000 --filter=blob:none \
            https://github.com/torvalds/linux.git /tmp/linux-kernel-snapshot

      - name: Run criterion benches
        env:
          CODELORE_BENCH_LINUX_KERNEL_PATH: /tmp/linux-kernel-snapshot
        run: |
          cargo bench -p codelore-lib --all-features --bench end_to_end -- \
            --output-format bencher | tee bench-output.txt

      - name: Upload bench results
        uses: actions/upload-artifact@v7
        with:
          name: bench-output
          path: bench-output.txt

      # Regression gate: track results in gh-pages and fail PRs that regress
      # baseline benches (tiny + medium) by >10%. The kernel bench is informational
      # only — too noisy on shared CI runners to gate on.
      - name: Track regression
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: bench-output.txt
          alert-threshold: '110%'
          fail-on-alert: false  # advisory on weekly runs; PRs would set true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          comment-on-alert: true
