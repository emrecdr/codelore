name: bench

on:
  schedule:
    - cron: '0 6 * * MON'  # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # bench results are timeline data; don't drop runs

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Include rust-toolchain.toml in the cache key so a Rust
          # toolchain bump invalidates cached artifacts. The rustc
          # version is part of every .rmeta / .rlib hash; carrying
          # stale artifacts across a toolchain bump produces cryptic
          # linker errors that get misdiagnosed as flaky CI.
          key: bench-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Cache Linux kernel snapshot
        id: kernel-cache
        uses: actions/cache@v5
        with:
          path: /tmp/linux-kernel-snapshot
          key: linux-kernel-snapshot-2026-06

      - name: Fetch Linux kernel snapshot
        # Bounded fetch with explicit error surfacing. Three modes
        # the previous bare `git clone` left ambiguous:
        #   1. Transient git.kernel.org / GitHub raw-network failure
        #      → noisy retry once before giving up.
        #   2. Disk-full mid-clone (the partial clone is ~2-3 GB)
        #      → set -e propagates the exit code; the job fails fast
        #      instead of producing a phantom "successful" clone the
        #      bench step then trips over.
        #   3. Repository moved / renamed upstream → exit 128 from
        #      git clone surfaces cleanly via set -e.
        # The bench step downstream takes `CODELORE_BENCH_LINUX_KERNEL_PATH`
        # and reads kernel files — a half-cloned repo is worse than no
        # clone (silent partial results vs explicit skip).
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          target=/tmp/linux-kernel-snapshot
          clone_url=https://github.com/torvalds/linux.git
          for attempt in 1 2; do
            echo "::group::clone attempt ${attempt}"
            if git clone --depth=10000 --filter=blob:none "${clone_url}" "${target}"; then
              echo "::endgroup::"
              # Sanity check: the bench reads kernel source files; a
              # zero-file clone (which can happen on partial network
              # truncation that git reports as success) breaks the
              # bench with an opaque "no files found" error. Verify a
              # known-present top-level file exists.
              if [[ -f "${target}/MAINTAINERS" ]]; then
                echo "kernel snapshot OK ($(du -sh "${target}" | cut -f1))"
                exit 0
              fi
              echo "clone reported success but MAINTAINERS missing — corrupted, retrying" >&2
              rm -rf "${target}"
            fi
            echo "::endgroup::"
            echo "clone attempt ${attempt} failed" >&2
            rm -rf "${target}"
          done
          echo "::error::kernel snapshot fetch failed after 2 attempts; bench job will not run" >&2
          exit 1

      - name: Run criterion benches
        env:
          CODELORE_BENCH_LINUX_KERNEL_PATH: /tmp/linux-kernel-snapshot
        run: |
          cargo bench -p codelore-lib --all-features --bench end_to_end -- \
            --output-format bencher | tee bench-output.txt

      - name: Upload bench results
        uses: actions/upload-artifact@v7
        with:
          name: bench-output
          path: bench-output.txt

      # Regression trend tracker (advisory). This workflow has NO
      # `pull_request` trigger — it runs post-merge only (weekly schedule +
      # manual dispatch, see the `on:` block above), so it never gates a PR.
      # `fail-on-alert: false` reports a >10% regression on the baseline
      # benches (tiny + medium) as a commit comment rather than failing.
      # The kernel bench is informational only — too noisy on shared CI
      # runners to gate on.
      # (To gate PRs later, add a cheap baseline-only subset under a
      # `pull_request` trigger; do NOT run the full suite on every PR.)
      - name: Track regression
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: bench-output.txt
          alert-threshold: '110%'
          fail-on-alert: false  # advisory only — post-merge trend tracker, never a PR gate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          comment-on-alert: true
