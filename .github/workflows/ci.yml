name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes skip the heavy test matrix. Limited to `push` so that
    # PRs ALWAYS run CI (avoids the required-check stuck-pending pitfall).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  # Manual re-trigger via `gh workflow run CI` or the Actions UI. Useful
  # when a tagged commit needs CI verification (tags don't fire `push`) or
  # when an earlier run was cancelled and an empty commit can't re-trigger
  # because of the `paths-ignore` filter above.
  workflow_dispatch:

# Cancel superseded runs for the same ref. For PRs this means each new push
# cancels the in-flight CI for the previous push. For main, sequential
# commits would also cancel each other, but main commits rarely arrive that
# fast and the more recent commit is what callers care about anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default for the whole workflow. Only the `dogfood` job
# widens this (to `contents: write`) via a job-level override, so it is
# the sole job that can push the generated demo to `gh-pages`.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # T10: disable incremental compilation in CI. Incremental compile
  # artifacts are problematic in cached environments — they get written
  # to disk + cached but invalidated on the next run (because hashes
  # change), wasting cache hit rate AND build time recomputing what
  # incremental was supposed to skip. The Rust CI consensus (cargo
  # docs, Swatinem/rust-cache README, ripgrep/cargo/clippy workflows)
  # is to disable it explicitly for CI runs. Saves ~30-60s per cold
  # job AND improves cache hit rate.
  CARGO_INCREMENTAL: "0"
  # CI never attaches a debugger, so debuginfo is pure cost here. On
  # MSVC it is the dominant cost: debug codegen plus PDB emission slow
  # both compilation and the per-test-binary links (every integration
  # test binary statically links the bundled DuckDB), which is what
  # pushed the windows job past its timeout. Backtraces in CI logs get
  # coarser (function-level, no line numbers) — an acceptable trade.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Compile caching is rust-cache's job alone. sccache's GitHub-cache
  # backend shares the repo's 10 GB Actions-cache quota with the
  # rust-cache entries; once the quota is exceeded its writes are
  # rejected and every compilation unit pays a wasted network
  # round-trip — worst on a cold runner that compiles everything,
  # which is how the windows job regressed from ~20 minutes to
  # blowing multi-hour timeouts. rust-cache caching of target/ is
  # what makes warm runs fast; a second cache layer fighting it for
  # the same quota made things slower, not faster.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Don't let one OS failure cancel the other two — we want full
      # cross-platform signal on every run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # CodeLore's integration tests walk this repo's own history (e.g.
          # gix_repo_walks_self_repo). gix needs parent ancestry to walk
          # commits, so a shallow clone (the default depth-1) fails with
          # `find_parent_commit ... could not be found` on the most-recent
          # commit's parent. This is the exact gotcha we document for our
          # users in advanced-usage §10 troubleshooting.
          fetch-depth: 0
      - name: Exclude build/test paths from Windows Defender
        # The suite builds hundreds of throwaway git-repo fixtures,
        # each via dozens of short-lived `git` processes writing many
        # small object files. Defender's real-time scan hooks every
        # process launch and file write, multiplying exactly that
        # workload — the dominant reason the same tests that finish in
        # minutes on linux run for hours here.
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionProcess "cargo.exe","rustc.exe","git.exe","link.exe"
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Save the cargo cache even when the job fails — a red test
          # run still warms the next attempt's compile.
          cache-on-failure: true
      # cargo-nextest: ~20-30% faster than `cargo test` on this workspace
      # (smarter parallelism, faster process spawning, better failure
      # aggregation). Doesn't run doc tests — those still need `cargo test
      # --doc` separately.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build test binaries
        run: cargo nextest run --workspace --features test-support,spa --no-run
      - name: Run tests (nextest)
        # `--all-features` would also activate `browser-tests`, which
        # requires a Chrome binary on the runner. The matrix test job
        # is the wrong place for that (windows runners pay a 5+ min
        # toll fetching Chromium even with the graceful-skip path).
        # The `spa-browser` job below opts in explicitly on
        # ubuntu-latest where Chrome is pre-installed. Spelling out
        # the non-browser feature set here keeps the matrix
        # cost-predictable.
        #
        # Windows is build-only for now: the suite that linux runs in
        # ~8 minutes exceeds 75 minutes of pure test execution on a
        # windows runner even with the shared fixtures served from
        # checked-in bundles (which cut it roughly 3x). The residual
        # cost is per-test process overhead across ~1000 test
        # processes plus the remaining bespoke per-test git builders.
        # The MSVC target stays compile-and-link-verified on every
        # push; restoring the full windows run needs a further pass
        # (bespoke-builder consolidation and/or a curated windows
        # test subset).
        if: matrix.os != 'windows-latest'
        run: cargo nextest run --workspace --features test-support,spa --no-fail-fast
      - name: Run doc tests
        # `cargo test --doc --workspace` does NOT honour per-package
        # `doctest = false` (long-standing cargo behaviour: the flag opts in
        # to running doctests for every package regardless). The vendored
        # `codelore-rca` carries Mozilla rust-code-analysis upstream doctests
        # that import `rust_code_analysis::*` (the pre-fork name) and so
        # don't compile. Excluded here so our doctests still gate without
        # forcing edits into the upstream-tracked vendored sources.
        run: cargo test --workspace --exclude codelore-rca --all-features --doc

  spa-browser:
    # Headless-browser smoke test for the SPA emitter. Closes the
    # runtime-defect blind spot that earlier string-grep tests
    # couldn't cover (production browser-console errors that ship
    # through every PR because no JS executes at CI time). The test
    # itself is gated on the `browser-tests` Cargo feature, so it
    # never fires in `cargo test --all-features` from the main test
    # matrix — it gets its own job that explicitly opts in.
    #
    # ubuntu-latest only: the test transitively depends on a Chrome
    # binary in the standard search path. ubuntu-latest pre-installs
    # Chrome; macos-latest also does but adds 4-5 min to the cold
    # build; windows-latest has it too but msvc + duckdb-bundled +
    # the Chrome path discovery combine into a measurable cost. The
    # primary goal here is catching JS regressions, not OS-portability
    # of the test harness — Chrome behaves identically across runners.
    name: spa-browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Run SPA browser smoke test
        # `--features browser-tests,spa,test-support` opts into all three:
        # the harness feature itself, the SPA emitter, and the in-process
        # fixture helpers. `cargo test --features` doesn't include
        # default features automatically; spelling each one keeps the
        # invocation reproducible across `cargo` upgrades.
        run: cargo test --features browser-tests,spa,test-support -p codelore-lib --test spa_browser_test

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  dogfood:
    # Run the release `codelore` binary against this repo's own history
    # so every PR surfaces what CodeLore thinks of its own changes —
    # hotspots, code-health drift, and (on PRs) the gate verdict. Output
    # is piped to GitHub's job summary so reviewers see it inline on
    # the Checks tab; the GHA workflow-command format also produces
    # inline annotations on the diff for any hotspot scoring as
    # `::warning::` or `::error::` per the bucketing in `output::gha`.
    #
    # `continue-on-error: true` during the bake-in period — the goal is
    # to surface signal, not to block merges while we're still calibrating
    # what the dogfood thresholds should be. Drop the flag once the
    # output stabilises across a few releases.
    name: dogfood
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    # Scoped to this job so only dogfood can push the generated demo to the
    # gh-pages branch. Every other job inherits the workflow's read-only
    # default — nothing else gains write access to the repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Same reason as the `test` job: dogfood walks this repo's
          # own history, so the gix walker needs parent ancestry.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Stable, release-profile-scoped cache slot. Dogfood is the only
          # `--release` compile in this workflow, so it cannot reuse the debug
          # target caches of clippy/test — a shared-key keeps its own cache
          # deterministic across PR runs (and lets a future release-profile job
          # share it). Deliberately NOT shared with the debug jobs: mixing
          # debug+release artifacts under one key would thrash both.
          shared-key: release-dogfood
      - name: Build release codelore
        run: cargo build --release -p codelore-cli --features spa
      - name: Analyze hotspots, code-health, knowledge-islands (GHA annotations)
        # `--format gha` surfaces hotspots as inline annotations on the
        # PR diff via the workflow-command lines printed to stdout.
        # `code-health` + `knowledge-islands` only support tabular
        # output today, so they run separately and land in step-summary
        # via the second step below.
        run: ./target/release/codelore analyze --analysis hotspots --repo . --format gha
      - name: Append behavioral summary to step-summary
        if: always()
        run: |
          {
            echo "## CodeLore behavioral summary"
            echo
            echo "### Top hotspots"
            ./target/release/codelore analyze --analysis hotspots --repo . --format markdown --rows 10
            echo
            echo "### Code health (worst 10)"
            ./target/release/codelore analyze --analysis code-health --repo . --format markdown --rows 10
            echo
            echo "### Knowledge islands"
            ./target/release/codelore analyze --analysis knowledge-islands --repo . --format markdown --rows 10
          } >> "$GITHUB_STEP_SUMMARY"
      - name: PR diff summary
        # Only meaningful on `pull_request` events — `codelore diff`
        # takes a positional `<base>...<head>` range (3-dot = use
        # merge-base of base & head). Pushed commits to main itself
        # get just the summary above.
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### PR change summary"
            ./target/release/codelore diff "origin/${{ github.base_ref }}...HEAD" --format markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish self-analysis dashboard demo to gh-pages
        # Regenerate the interactive SPA of codelore analysing its own
        # repository and publish it to `gh-pages` under `demo/`, so
        # https://emrecdr.github.io/codelore/demo/ is always current. The
        # `spa` format is orthogonal to `--analysis`: it bundles the full
        # multi-widget dashboard on its own. Runs on main pushes only —
        # PRs must never publish, and the job-level `contents: write`
        # above is what authorises the push.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ./target/release/codelore analyze --format spa --output demo-index.html --repo .
          git fetch origin gh-pages
          git worktree add ../ghp gh-pages
          mkdir -p ../ghp/demo
          cp demo-index.html ../ghp/demo/index.html
          git -C ../ghp add demo/index.html
          if git -C ../ghp diff --cached --quiet; then
            echo "Demo unchanged; nothing to publish."
          else
            git -C ../ghp -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Publish self-analysis dashboard demo'
            git -C ../ghp push origin gh-pages
          fi
          git worktree remove --force ../ghp
