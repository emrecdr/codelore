name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes skip the heavy test matrix. Limited to `push` so that
    # PRs ALWAYS run CI (avoids the required-check stuck-pending pitfall).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  # Manual re-trigger via `gh workflow run CI` or the Actions UI. Useful
  # when a tagged commit needs CI verification (tags don't fire `push`) or
  # when an earlier run was cancelled and an empty commit can't re-trigger
  # because of the `paths-ignore` filter above.
  workflow_dispatch:

# Cancel superseded runs for the same ref. For PRs this means each new push
# cancels the in-flight CI for the previous push. For main, sequential
# commits would also cancel each other, but main commits rarely arrive that
# fast and the more recent commit is what callers care about anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # T10: disable incremental compilation in CI. Incremental compile
  # artifacts are problematic in cached environments — they get written
  # to disk + cached but invalidated on the next run (because hashes
  # change), wasting cache hit rate AND build time recomputing what
  # incremental was supposed to skip. The Rust CI consensus (cargo
  # docs, Swatinem/rust-cache README, ripgrep/cargo/clippy workflows)
  # is to disable it explicitly for CI runs. Saves ~30-60s per cold
  # job AND improves cache hit rate.
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      # Vendor + patch libduckdb-sys per duckdb-rs#786 (MSVC 19.40 fix).
      # Required even for fmt because Cargo.toml's [patch.crates-io]
      # entry points at vendor/duckdb-rs/ unconditionally; cargo's
      # manifest validation reads the patch path. Idempotent; the
      # script no-ops if vendor/ is already at the right rev.
      - name: Vendor patched libduckdb-sys (duckdb-rs#786)
        run: bash scripts/vendor-duckdb-rs.sh
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: Vendor patched libduckdb-sys (duckdb-rs#786)
        run: bash scripts/vendor-duckdb-rs.sh
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  test:
    name: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
    strategy:
      # Don't let one OS failure cancel the other two — we want full
      # cross-platform signal on every run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          # CodeLore's integration tests walk this repo's own history (e.g.
          # gix_repo_walks_self_repo). gix needs parent ancestry to walk
          # commits, so a shallow clone (the default depth-1) fails with
          # `find_parent_commit ... could not be found` on the most-recent
          # commit's parent. This is the exact gotcha we document for our
          # users in advanced-usage §10 troubleshooting.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: Vendor patched libduckdb-sys (duckdb-rs#786)
        shell: bash
        run: bash scripts/vendor-duckdb-rs.sh
      # cargo-nextest: ~20-30% faster than `cargo test` on this workspace
      # (smarter parallelism, faster process spawning, better failure
      # aggregation). Doesn't run doc tests — those still need `cargo test
      # --doc` separately.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run tests (nextest)
        # `--all-features` would also activate `browser-tests`, which
        # requires a Chrome binary on the runner. The matrix test job
        # is the wrong place for that (windows runners pay a 5+ min
        # toll fetching Chromium even with the graceful-skip path).
        # The `spa-browser` job below opts in explicitly on
        # ubuntu-latest where Chrome is pre-installed. Spelling out
        # the non-browser feature set here keeps the matrix
        # cost-predictable.
        run: cargo nextest run --workspace --features test-support,spa --no-fail-fast
      - name: Run doc tests
        # `cargo test --doc --workspace` does NOT honour per-package
        # `doctest = false` (long-standing cargo behaviour: the flag opts in
        # to running doctests for every package regardless). The vendored
        # `codelore-rca` carries Mozilla rust-code-analysis upstream doctests
        # that import `rust_code_analysis::*` (the pre-fork name) and so
        # don't compile. Excluded here so our doctests still gate without
        # forcing edits into the upstream-tracked vendored sources.
        run: cargo test --workspace --exclude codelore-rca --all-features --doc
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  spa-browser:
    # Headless-browser smoke test for the SPA emitter. Closes the
    # runtime-defect blind spot that earlier string-grep tests
    # couldn't cover (production browser-console errors that ship
    # through every PR because no JS executes at CI time). The test
    # itself is gated on the `browser-tests` Cargo feature, so it
    # never fires in `cargo test --all-features` from the main test
    # matrix — it gets its own job that explicitly opts in.
    #
    # ubuntu-latest only: the test transitively depends on a Chrome
    # binary in the standard search path. ubuntu-latest pre-installs
    # Chrome; macos-latest also does but adds 4-5 min to the cold
    # build; windows-latest has it too but msvc + duckdb-bundled +
    # the Chrome path discovery combine into a measurable cost. The
    # primary goal here is catching JS regressions, not OS-portability
    # of the test harness — Chrome behaves identically across runners.
    name: spa-browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: Vendor patched libduckdb-sys (duckdb-rs#786)
        run: bash scripts/vendor-duckdb-rs.sh
      - name: Run SPA browser smoke test
        # `--features browser-tests,spa,test-support` opts into all three:
        # the harness feature itself, the SPA emitter, and the in-process
        # fixture helpers. `cargo test --features` doesn't include
        # default features automatically; spelling each one keeps the
        # invocation reproducible across `cargo` upgrades.
        run: cargo test --features browser-tests,spa,test-support -p codelore-lib --test spa_browser_test
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # cargo-deny-action runs `cargo metadata` inside a Docker container that
      # mounts the host workspace. The workspace Cargo.toml's `[patch.crates-io]`
      # block resolves to vendor/, which must exist on the host before the
      # action fires, or `cargo metadata` errors with "failed to read
      # vendor/duckdb-rs/.../Cargo.toml". Idempotent vendoring per duckdb-rs#786.
      - name: Vendor patched libduckdb-sys (duckdb-rs#786)
        run: bash scripts/vendor-duckdb-rs.sh
      - uses: EmbarkStudios/cargo-deny-action@v2
