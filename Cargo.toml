[workspace]
resolver = "2"
members = ["crates/codelore-lib", "crates/codelore-cli", "crates/codelore-rca"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
repository = "https://github.com/emrecdr/codelore"
# crates.io discovery — surfaces in search results + on the package page.
# Mirrors the GitHub topic tags configured on the repository (see README
# badges + docs/CONTRIBUTING for the same tag list).
keywords = [
    "behavioral-code-analysis",
    "code-analysis",
    "repository-mining",
    "technical-debt",
    "code-maat",
]
# https://crates.io/category_slugs — pick the most-applicable buckets so
# crates.io's category filter surfaces us.
categories = [
    "command-line-utilities",
    "development-tools",
]

# cargo-dist config (https://opensource.axo.dev/cargo-dist/).
# Owner runs `cargo dist init` once to refresh .github/workflows/release.yml.
# This block locks the platforms + installers in advance so the regenerated
# workflow stays consistent across machines.
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = "github"
installers = ["shell", "powershell", "msi", "homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Homebrew tap (placeholder; replace before first release)
tap = "emrecdr/homebrew-codelore"
publish-jobs = ["homebrew"]
# Generate a binstall manifest so `cargo binstall codelore` works day one
pr-run-mode = "plan"
install-updater = false
# Pinned runners for reproducibility
[workspace.metadata.dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# PGO scaffolding (spec §6.5: campaign deferred to v1.1).
# Run `scripts/pgo.sh` against a representative workload (Linux kernel snapshot)
# to produce a PGO-optimized binary. v1.0 ships the regular release profile;
# v1.1 will flip the release pipeline to use this profile after the benchmark
# suite is stable enough to validate the gains.
[profile.release-pgo]
inherits = "release"
lto = "fat"
codegen-units = 1
