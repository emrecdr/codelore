[workspace]
resolver = "2"
members = ["crates/codelore-lib", "crates/codelore-cli", "crates/codelore-rca"]

[workspace.package]
version = "0.27.1"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
repository = "https://github.com/emrecdr/codelore"
readme = "README.md"
# crates.io discovery — surfaces in search results + on the package page.
# Mirrors the GitHub topic tags configured on the repository (see README
# badges + docs/CONTRIBUTING for the same tag list), except one keyword is
# shortened from its GitHub topic form to fit crates.io's 20-character
# keyword limit.
keywords = [
    "behavioral-analysis",
    "code-analysis",
    "repository-mining",
    "technical-debt",
    "code-maat",
]
# https://crates.io/category_slugs — pick the most-applicable buckets so
# crates.io's category filter surfaces us.
categories = [
    "command-line-utilities",
    "development-tools",
]

# NOTE: this workspace previously carried a [workspace.metadata.dist] block
# for cargo-dist. The release pipeline now lives entirely in
# .github/workflows/release.yml as hand-rolled steps (build matrix, SLSA L3
# attestation via attest-build-provenance, GitHub Release publish, Homebrew
# formula regeneration). cargo-dist itself is not invoked anywhere, so the
# metadata block was inert and has been removed to avoid drift between
# documented intent and actual behaviour. If cargo-dist is reintroduced
# later, the workflow needs full audit first — the current SLSA pathway
# patches around cargo-dist's previously-broken SLSA generator step.

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# Panics unwind rather than abort. `codelore mcp` is a long-lived server
# whose tools run on `spawn_blocking`; unwinding turns a panicking tool into
# a `JoinError` the handler reports as an MCP error, so one bad tool call no
# longer takes the whole server (and the client's pipe) down. Unwinding also
# keeps destructors running, so `diff`'s `Worktree` still removes its
# `git worktree` checkout on the panic path instead of leaking it. The cost
# is ~2.4 MiB of landing pads on a ~48 MiB binary; `lto`/`strip` below
# recover far more than that.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# PGO scaffolding (spec §6.5: campaign deferred to v1.1).
# Run `scripts/pgo.sh` against a representative workload (Linux kernel snapshot)
# to produce a PGO-optimized binary. v1.0 ships the regular release profile;
# v1.1 will flip the release pipeline to use this profile after the benchmark
# suite is stable enough to validate the gains.
[profile.release-pgo]
inherits = "release"
lto = "fat"
codegen-units = 1

# MCP server dependencies pinned here so codelore-cli can reference them as
# { workspace = true } — keeps version constraints in one place.
[workspace.dependencies]
rmcp = { version = "3.1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "sync"] }
schemars = "1"
