[workspace]
resolver = "2"
members = ["crates/codelore-lib", "crates/codelore-cli", "crates/codelore-rca"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-only"
repository = "https://github.com/<owner>/codelore"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# PGO scaffolding (spec §6.5: campaign deferred to v1.1).
# Run `scripts/pgo.sh` against a representative workload (Linux kernel snapshot)
# to produce a PGO-optimized binary. v1.0 ships the regular release profile;
# v1.1 will flip the release pipeline to use this profile after the benchmark
# suite is stable enough to validate the gains.
[profile.release-pgo]
inherits = "release"
lto = "fat"
codegen-units = 1
