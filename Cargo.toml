[workspace]
resolver = "2"
members = ["crates/codelore-lib", "crates/codelore-cli", "crates/codelore-rca"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
repository = "https://github.com/emrecdr/codelore"
# crates.io discovery — surfaces in search results + on the package page.
# Mirrors the GitHub topic tags configured on the repository (see README
# badges + docs/CONTRIBUTING for the same tag list).
keywords = [
    "behavioral-code-analysis",
    "code-analysis",
    "repository-mining",
    "technical-debt",
    "code-maat",
]
# https://crates.io/category_slugs — pick the most-applicable buckets so
# crates.io's category filter surfaces us.
categories = [
    "command-line-utilities",
    "development-tools",
]

# NOTE: this workspace previously carried a [workspace.metadata.dist] block
# for cargo-dist. The release pipeline now lives entirely in
# .github/workflows/release.yml as hand-rolled steps (build matrix, SLSA L3
# attestation via attest-build-provenance, GitHub Release publish, Homebrew
# formula regeneration). cargo-dist itself is not invoked anywhere, so the
# metadata block was inert and has been removed to avoid drift between
# documented intent and actual behaviour. If cargo-dist is reintroduced
# later, the workflow needs full audit first — the current SLSA pathway
# patches around cargo-dist's previously-broken SLSA generator step.

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# Vendored libduckdb-sys patch — workaround for upstream issue
# duckdb/duckdb-rs#786. MSVC 19.40 (toolchain version 14.51, rolled out
# by GitHub Actions runners around 2026-06-12) removed
# `stdext::checked_array_iterator`, breaking bundled DuckDB builds on
# Windows. The upstream patch hasn't shipped in a released crate yet.
#
# `vendor/duckdb-rs/` is populated by `scripts/vendor-duckdb-rs.sh` —
# run that before `cargo build` on a fresh checkout (CI does this
# automatically; see ci.yml / release.yml). The directory is
# `.gitignore`d.
#
# Remove this `[patch.crates-io]` block, the script, the patch file,
# and the workflow steps when `duckdb/duckdb-rs#786` ships in a
# released duckdb crate version.
[patch.crates-io]
libduckdb-sys = { path = "vendor/duckdb-rs/crates/libduckdb-sys" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# PGO scaffolding (spec §6.5: campaign deferred to v1.1).
# Run `scripts/pgo.sh` against a representative workload (Linux kernel snapshot)
# to produce a PGO-optimized binary. v1.0 ships the regular release profile;
# v1.1 will flip the release pipeline to use this profile after the benchmark
# suite is stable enough to validate the gains.
[profile.release-pgo]
inherits = "release"
lto = "fat"
codegen-units = 1
