name: 'CodeLore'
description: >
  Behavioural code analysis — hotspots, knowledge-islands, live clones,
  change coupling, and more. Drop-in successor to code-maat with modern
  improvements: Fisher significance, SARIF output, persistent cache,
  automatic bus-factor detection.
author: 'CodeLore contributors'
branding:
  icon: 'git-branch'
  color: 'purple'

inputs:
  command:
    description: 'Which codelore subcommand to run: analyze (default) | check | gate | diff. The analysis/format/output inputs apply to analyze only; for check/gate/diff pass command-specific flags (and diff''s <base>..<head> range) via `args`.'
    required: false
    default: 'analyze'
  analysis:
    description: 'Which analysis to run (e.g. hotspots, knowledge-islands, clone-coupling, code-health, summary). Applies to `command: analyze` only.'
    required: false
    default: 'hotspots'
  format:
    description: 'Output format (csv | json | sarif | markdown | parquet | sqlite | html). Applies to `command: analyze` only.'
    required: false
    default: 'sarif'
  output:
    description: 'Output file path (relative to GITHUB_WORKSPACE). Empty = stdout. Applies to `command: analyze` only.'
    required: false
    default: 'codelore-result'
  repo:
    description: 'Path to the repository to analyse (defaults to the workspace root checked out by actions/checkout).'
    required: false
    default: '.'
  args:
    description: 'Additional CLI flags appended verbatim to the codelore invocation. For analyze: --rows, --min-revs, --departed-threshold-days, --code-maat-compat, --age-time-now, etc. For check/gate/diff this carries the command-specific flags (--thresholds-file, --ratchet, --fail-on, and diff''s <base>..<head> range).'
    required: false
    default: ''
  version:
    description: 'Which codelore release to download. `latest` follows the most recent v* tag; `vX.Y.Z` pins a specific release.'
    required: false
    default: 'latest'

outputs:
  result-path:
    description: 'Absolute path to the generated output file (empty when --format streams to stdout, and always empty for command: check/gate/diff, which have no output file).'
    value: ${{ steps.run.outputs.result-path }}
  version-used:
    description: 'The actual codelore version that was downloaded (resolved from `latest` or pinned).'
    value: ${{ steps.install.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Resolve codelore version
      id: resolve
      shell: bash
      env:
        # Authenticate the GitHub API request to avoid rate-limit
        # failures on shared GHA runner IPs. `github.token` is provided
        # by the workflow context and grants read-only API access by
        # default.
        GH_TOKEN: ${{ github.token }}
        # Caller-controlled input passed through the environment (not
        # spliced into the script text at render time) so a crafted
        # value cannot break out of the shell command.
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        VERSION="$INPUT_VERSION"
        if [ "$VERSION" = "latest" ]; then
          # Resolve the latest v* tag via the GitHub API. Authenticated
          # via $GH_TOKEN to avoid IP-based rate limits.
          VERSION=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/emrecdr/codelore/releases/latest \
            | grep -oE '"tag_name"\s*:\s*"v[^"]+"' \
            | head -1 \
            | sed -E 's/.*"v([^"]+)"/v\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::failed to resolve latest codelore version from GitHub API"
            exit 1
          fi
        fi
        # Accept both `vX.Y.Z` and `X.Y.Z` inputs by normalising to the
        # `vX.Y.Z` form. GitHub release tags are always v-prefixed, so an
        # unprefixed version would 404 on the download URL.
        if [[ "$VERSION" != v* ]]; then
          VERSION="v$VERSION"
        fi
        TAG="$VERSION"
        VERSION_NO_V="${VERSION#v}"
        echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
        echo "version=$VERSION_NO_V" >> "$GITHUB_OUTPUT"
        echo "Resolved codelore version: $TAG"

    - name: Detect target triple
      id: target
      shell: bash
      run: |
        set -euo pipefail
        # Map the runner OS+arch to the codelore release archive name.
        # codelore ships 5 targets:
        #   x86_64-apple-darwin       (macos x86_64)
        #   aarch64-apple-darwin      (macos arm64)
        #   x86_64-unknown-linux-gnu  (linux x86_64)
        #   aarch64-unknown-linux-gnu (linux arm64)
        #   x86_64-pc-windows-msvc    (windows x86_64)
        case "${{ runner.os }}" in
          Linux)
            case "${{ runner.arch }}" in
              X64)   TARGET="x86_64-unknown-linux-gnu" ;;
              ARM64) TARGET="aarch64-unknown-linux-gnu" ;;
              *) echo "::error::unsupported Linux arch ${{ runner.arch }}"; exit 1 ;;
            esac
            EXT="tar.gz"
            ;;
          macOS)
            case "${{ runner.arch }}" in
              X64)   TARGET="x86_64-apple-darwin" ;;
              ARM64) TARGET="aarch64-apple-darwin" ;;
              *) echo "::error::unsupported macOS arch ${{ runner.arch }}"; exit 1 ;;
            esac
            EXT="tar.gz"
            ;;
          Windows)
            TARGET="x86_64-pc-windows-msvc"
            EXT="zip"
            ;;
          *)
            echo "::error::unsupported runner OS ${{ runner.os }}"
            exit 1
            ;;
        esac
        echo "target=$TARGET" >> "$GITHUB_OUTPUT"
        echo "ext=$EXT"       >> "$GITHUB_OUTPUT"

    - name: Download + extract codelore
      id: install
      shell: bash
      run: |
        set -euo pipefail
        TAG="${{ steps.resolve.outputs.tag }}"
        VERSION="${{ steps.resolve.outputs.version }}"
        TARGET="${{ steps.target.outputs.target }}"
        EXT="${{ steps.target.outputs.ext }}"
        ARCHIVE="codelore-${TAG}-${TARGET}.${EXT}"
        URL="https://github.com/emrecdr/codelore/releases/download/${TAG}/${ARCHIVE}"
        DEST="$RUNNER_TEMP/codelore"
        mkdir -p "$DEST"
        echo "Downloading $URL"
        curl -fsSL --retry 3 --retry-delay 2 -o "$DEST/$ARCHIVE" "$URL"
        # Verify the download against the release's SHA256SUMS manifest.
        # Backward-compatible: releases cut before the manifest existed have
        # no such file, so a 404 (or a manifest lacking this archive's entry)
        # warns and proceeds; a present entry that fails to match is a hard
        # failure.
        SUMS_URL="https://github.com/emrecdr/codelore/releases/download/${TAG}/SHA256SUMS"
        if curl -fsSL --retry 3 --retry-delay 2 -o "$DEST/SHA256SUMS" "$SUMS_URL" 2>/dev/null \
          && grep -q " ${ARCHIVE}\$" "$DEST/SHA256SUMS"; then
          # Prefer sha256sum (Linux runners, Git-Bash on Windows); fall back
          # to `shasum -a 256` on runners that ship only the Perl tool.
          if command -v sha256sum >/dev/null 2>&1; then
            SHA_CHECK=(sha256sum -c -)
          else
            SHA_CHECK=(shasum -a 256 -c -)
          fi
          # SHA256SUMS lists bare archive names, so check from $DEST where the
          # archive was downloaded to match those names.
          if (cd "$DEST" && grep " ${ARCHIVE}\$" SHA256SUMS | "${SHA_CHECK[@]}"); then
            echo "checksum verified: $ARCHIVE"
          else
            echo "::error::checksum verification failed for $ARCHIVE"
            exit 1
          fi
        else
          echo "::warning::no SHA256SUMS published for ${TAG}; skipping checksum verification (older release)"
        fi
        case "$EXT" in
          tar.gz) tar -xzf "$DEST/$ARCHIVE" -C "$DEST" ;;
          zip)    unzip -q "$DEST/$ARCHIVE" -d "$DEST" ;;
        esac
        # The release archive layout is `codelore` (or `codelore.exe`) at
        # the root of the extracted directory. Verify + add to PATH.
        BIN="$DEST/codelore"
        if [ "${{ runner.os }}" = "Windows" ]; then
          BIN="$DEST/codelore.exe"
        fi
        if [ ! -x "$BIN" ] && [ "${{ runner.os }}" != "Windows" ]; then
          chmod +x "$BIN" || true
        fi
        if [ ! -f "$BIN" ]; then
          echo "::error::extracted archive does not contain expected binary at $BIN"
          ls -la "$DEST"
          exit 1
        fi
        echo "$DEST" >> "$GITHUB_PATH"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        "$BIN" --version

    - name: Run codelore
      id: run
      shell: bash
      env:
        # Caller-controlled inputs passed through the environment (not
        # spliced into the script text at render time) so a crafted
        # value cannot break out of the shell command.
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_ANALYSIS: ${{ inputs.analysis }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        COMMAND="$INPUT_COMMAND"
        ANALYSIS="$INPUT_ANALYSIS"
        FORMAT="$INPUT_FORMAT"
        OUTPUT="$INPUT_OUTPUT"
        REPO="$INPUT_REPO"
        EXTRA_ARGS="$INPUT_ARGS"

        case "$COMMAND" in
          analyze|check|gate|diff) ;;
          *)
            echo "::error::unknown command: $COMMAND (expected analyze|check|gate|diff)"
            exit 1
            ;;
        esac

        # Word-split the extra args (users pass multiple flags) with
        # globbing disabled so a bare `*` cannot expand to the workspace
        # file list.
        set -f
        # shellcheck disable=SC2206
        EXTRA_ARRAY=($EXTRA_ARGS)
        set +f

        if [ "$COMMAND" = "analyze" ]; then
          CMD=(codelore analyze --analysis "$ANALYSIS" --format "$FORMAT" --repo "$REPO" --no-banner)
          if [ -n "$OUTPUT" ]; then
            CMD+=(--output "$OUTPUT")
          fi
        else
          # check / gate / diff have no analysis/format/output surface — the
          # format input defaults to sarif, which gate rejects — so those are
          # analyze-only. The command-specific flags (and diff's
          # <base>..<head> range) arrive verbatim through the args escape hatch.
          CMD=(codelore "$COMMAND" --repo "$REPO" --no-banner)
        fi

        # Expanding an empty array as "${arr[@]}" is an unbound-variable
        # error under `set -u` before bash 4.4, and `args` is empty by
        # default — so append only when there is something to append.
        if [ ${#EXTRA_ARRAY[@]} -gt 0 ]; then
          CMD+=("${EXTRA_ARRAY[@]}")
        fi

        echo "Running: ${CMD[*]}"
        "${CMD[@]}"

        if [ "$COMMAND" = "analyze" ] && [ -n "$OUTPUT" ]; then
          # Pure-bash absolute-path resolution — portable and
          # dependency-free. macOS's BSD `readlink` lacks the `-f` flag
          # (a GNU extension), so resolving the path in bash avoids
          # depending on GNU coreutils or a preinstalled Python.
          if [[ "$OUTPUT" = /* ]]; then
            ABS_OUTPUT="$OUTPUT"
          else
            ABS_OUTPUT="$PWD/$OUTPUT"
          fi
          echo "result-path=$ABS_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "Output written to: $ABS_OUTPUT"
        fi
