[package]
name = "bca-lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Behavioral Code Analyzer — library"

[lints]
workspace = true

[dependencies]
time = { version = "0.3", features = ["serde", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
arrow = "58.3"
gix = { version = "0.84", features = ["max-performance", "blob-diff"] }
tempfile = { version = "3", optional = true }
duckdb = { version = "=1.10503.1", features = ["bundled", "appender-arrow"] }
crossbeam-channel = "0.5"
bca-rca = { path = "../bca-rca", version = "0.1.0-alpha.1" }

[features]
default = []
test-support = ["dep:tempfile"]

[[test]]
name = "facts_test"
required-features = ["test-support"]

[[test]]
name = "gix_repo_test"
required-features = ["test-support"]

[[test]]
name = "ingest_test"
required-features = ["test-support"]

[[test]]
name = "revisions_test"
required-features = ["test-support"]

[[test]]
name = "complexity_test"

[[test]]
name = "hotspots_test"
required-features = ["test-support"]

[[test]]
name = "code_health_test"
required-features = ["test-support"]

[[test]]
name = "mailmap_test"
required-features = ["test-support"]
