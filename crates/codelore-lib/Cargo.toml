[package]
name = "codelore-lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CodeLore — Behavioral Code Analyzer library"

[lints]
workspace = true

[dependencies]
time = { version = "0.3", features = ["serde", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
arrow = "58.3"
gix = { version = "0.84", features = ["max-performance", "blob-diff"] }
tempfile = { version = "3", optional = true }
duckdb = { version = "=1.10503.1", features = ["bundled", "appender-arrow"] }
crossbeam-channel = "0.5"
codelore-rca = { path = "../codelore-rca", version = "0.1.0-alpha.1" }
fishers_exact = "1"
sha2 = "0.10"
hex = "0.4"
# Direct tree-sitter + grammar deps for clone-detection AST walking (Plan 7).
# All pinned to the exact versions codelore-rca uses, for parser-ABI compat.
tree-sitter = "=0.25.3"
tree-sitter-rust = "=0.23.2"
tree-sitter-python = "=0.23.6"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.23.1"
tree-sitter-typescript = "=0.23.1"
walkdir = "2"
globset = "0.4"

[features]
default = []
test-support = ["dep:tempfile"]

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "end_to_end"
harness = false
required-features = ["test-support"]

[[test]]
name = "facts_test"
required-features = ["test-support"]

