<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --bg-elev: #1a1a1a;
      --bg-elev-2: #232323;
      --fg: #e6e6e6;
      --fg-dim: #8a8a8a;
      --accent: #2ea44f;
      --accent-warn: #f59e0b;
      --accent-danger: #e0584e;
      --border: #2a2a2a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    header {
      padding: 20px 28px;
      background: var(--bg-elev);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 20px;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    header .meta {
      color: var(--fg-dim);
      font-size: 12px;
    }
    main {
      padding: 28px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
      max-width: 1600px;
      margin: 0 auto;
    }
    .widget {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .widget h2 {
      margin: 0 0 4px 0;
      font-size: 14px;
      font-weight: 600;
    }
    .widget .subtitle {
      color: var(--fg-dim);
      font-size: 12px;
      margin-bottom: 16px;
    }
    .widget-body {
      width: 100%;
      height: 600px;
    }
    .widget .empty {
      color: var(--fg-dim);
      padding: 40px;
      text-align: center;
    }
    footer {
      padding: 20px 28px;
      color: var(--fg-dim);
      font-size: 12px;
      text-align: center;
      border-top: 1px solid var(--border);
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>{{TITLE}}</h1>
    <div class="meta">
      <span>{{REPO_PATH}}</span>
      ·
      <span>generated {{GENERATED_AT}}</span>
    </div>
  </header>

  <main>
    <section class="widget" id="widget-hotspot-circle-pack">
      <h2>Hotspots</h2>
      <div class="subtitle">
        Files sized by churn (revisions), colored by complexity (cognitive).
        Click a circle for details. Click an empty area to zoom out.
      </div>
      <div id="widget-hotspot-circle-pack-body" class="widget-body"></div>
    </section>
  </main>

  <footer>
    Generated by
    <a href="https://github.com/emrecdr/codelore" rel="noopener">CodeLore</a>
    — the behavioral-code-analysis CLI with published deterministic formulas.
  </footer>

  <script type="application/json" id="codelore-data">
{{DATA_JSON}}
  </script>

  <!-- Vendored libraries, SHA-pinned at build time. See crates/codelore-lib/build.rs. -->
  <script>{{ECHARTS_JS}}</script>
  <script>{{D3_HIERARCHY_JS}}</script>

  <!-- Widget render logic. -->
  <script>{{WIDGETS_JS}}</script>
</body>
</html>
