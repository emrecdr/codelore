[package]
name = "codelore-rca"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Original files retain MPL-2.0; new files we add are GPL-3.0-only.
# Both terms apply to the crate as a whole.
license = "MPL-2.0 AND GPL-3.0-only"
repository.workspace = true
description = "Vendored fork of Mozilla rust-code-analysis for CodeLore"
# The fork-provenance doc, not the project README — the crates.io page for
# this crate should explain what is vendored and why.
readme = "UPSTREAM.md"
keywords.workspace = true
categories.workspace = true

# Don't apply workspace lints to vendored MPL files — keeps upstream-merge friction low.
# See UPSTREAM.md for rationale.
[lints]

[dependencies]
# Tree-sitter core — pinned workspace-wide; the grammars below are pinned to
# versions whose generated node IDs match this core.
tree-sitter = "=0.25.3"

# Per-language tree-sitter grammars.
# Versions pinned to exact versions whose node-ID tables match the generated language_*.rs enums.
# These were verified by checking root node kind_id against enum constants.
tree-sitter-javascript  = "=0.23.1"   # language_javascript.rs: Program=133
tree-sitter-typescript  = "=0.23.1"   # language_typescript.rs: Program=166 / language_tsx.rs: Program=172
tree-sitter-python      = "=0.23.6"   # language_python.rs: Module=108
tree-sitter-java        = "=0.23.5"   # language_java.rs: Program=138
tree-sitter-rust        = "=0.23.2"   # language_rust.rs: SourceFile=155

# Standard RCA dependencies
serde       = { version = "1", features = ["derive"] }
crossbeam   = "0.8"
walkdir     = "2"
regex       = "1"
globset     = "0.4"
termcolor   = "1"
num-format  = "0.4"
# The three crates below serve three different consumers in the generated
# `language_*.rs` enums, and only two of them can be found by searching:
#   `num`        — the call sites, `num::FromPrimitive::from_u16(x)`.
#   `num-derive` — the `#[derive(FromPrimitive)]` attribute itself.
#   `num-traits` — required by that derive's *expansion*, which emits
#                  `extern crate num_traits as _num_traits;`. An `extern
#                  crate` item resolves only against this crate's own extern
#                  prelude, so a transitive copy cannot satisfy it and the
#                  dependency has to stay direct. It appears nowhere in the
#                  source text, so unused-dependency scanners report it as
#                  removable; removing it fails the build with
#                  `error[E0463]: can't find crate for num_traits`. The
#                  metadata table below says so to the scanner directly — a
#                  comment only reaches someone who opens this file, and the
#                  report is read as tool output.
num         = { version = "0.4", features = ["std"] }
num-derive  = "0.5"
num-traits  = "0.2"

# A derive expansion is an opaque token stream to a text-based scanner, so
# `num-traits` is unreachable by the analysis `cargo machete` performs and it
# is reported as removable on every run. Suppressing the one false positive
# here keeps the remaining findings worth reading; it is not a gate, and the
# grammar false positives are deliberately left visible.
[package.metadata.cargo-machete]
ignored = ["num-traits"]

[features]
default = []
# Gates buggy JS/TS Halstead and MI metrics (upstream issues #528 #1183).
# When enabled, the metrics are computed but accuracy is not guaranteed.
metrics-experimental = []

[lib]
# Upstream doc examples use `use rust_code_analysis::*` (old crate name); suppress until renamed.
doctest = false

[[test]]
name = "tier1_languages_smoke"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
pretty_assertions = "1"
