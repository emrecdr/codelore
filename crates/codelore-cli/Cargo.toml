[package]
name = "codelore-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CodeLore — Behavioral Code Analyzer CLI"

[[bin]]
name = "codelore"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
codelore-lib = { path = "../codelore-lib", version = "0.1.0-alpha.1" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Plan 8 §7: dirs (cache root for diff worktrees), serde/serde_json
# (DiffOutput + --base-cache serialization), tempfile (worktree tempdirs).
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
walkdir = "2"
codelore-lib = { path = "../codelore-lib", version = "0.1.0-alpha.1", features = ["test-support"] }
