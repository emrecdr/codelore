[package]
name = "codelore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CodeLore — Behavioral Code Analyzer CLI"
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# Point crates.io at the user guide rather than docs.rs. This crate is
# binary-only — no `[lib]`, no `src/lib.rs` — so rustdoc has no library
# target to document and the docs.rs build reports failure by design.
# Without this key crates.io falls back to that failed build, which means
# the one crate users actually `cargo install` advertises a broken docs
# link. This is not a docs.rs problem to fix; it is the wrong destination.
documentation = "https://emrecdr.github.io/codelore/"

# `cargo binstall codelore` — the fast install path the README
# recommends. It already resolves without this block, but only
# incidentally: our asset names happen to match one of binstall's
# built-in probe patterns (`{name}-v{version}-{target}`), and that list
# and its ordering belong to binstall, not to us. Declaring the URL
# makes a documented install path explicit instead of coincidental.
#
# The suffix is spelled literally rather than as `{ archive-suffix }`,
# which renders the package format's own extension: the workflow
# publishes `.tar.gz`, so a literal keeps the manifest and
# `.github/workflows/release.yml` (`archive_name`) visibly in step. The
# two must change together.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
# This is the load-bearing line. Binstall's normal fallback, when it
# cannot find an official asset, is the quickinstall third-party host —
# which serves ITS OWN builds of this crate, carrying none of the build
# provenance the release workflow attests. Silently substituting an
# unattested binary is the wrong default for a tool whose users chose it
# partly for that posture, so the fallback is refused. Compilation from
# source stays enabled: a target we do not publish should still install,
# just slowly, from code the user can audit.
disabled-strategies = ["quick-install"]

# Windows ships a zip with `codelore.exe` at the archive root; `bin-dir`
# above already resolves the `.exe` through `{ binary-ext }`.
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[[bin]]
name = "codelore"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []

# `spa` — propagate the lib's `spa` feature so the binary can dispatch
# `--format spa`. Released binaries ship with this enabled at the
# release-workflow level; `cargo install codelore` defaults to OFF so
# users without internet (or without the dashboard need) can install
# cleanly.
spa = ["codelore-lib/spa"]

[dependencies]
codelore-lib = { path = "../codelore-lib", version = "0.29.1" }
clap = { version = "4", features = ["derive"] }
# Shell completion generation for bash / zsh / fish / PowerShell / elvish.
# Derives the spec from the existing clap derive macros — no hand-maintained
# completion files.
clap_complete = "4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Serialised command output and the scratch checkouts that produce it, shared
# across several commands: serde/serde_json for the `diff`, `gate`, `calibrate`
# and `mcp` payloads, tempfile for the throwaway worktree and corpus checkouts
# those commands make.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# `--age-time-now` flag parses YYYY-MM-DD into time::Date. Matches the
# codelore-lib date type so we don't bring in a second date crate.
time = { version = "0.3", features = ["macros", "parsing"] }
# MCP server (`codelore mcp`). stdio transport only; tokio rt-multi-thread
# required by rmcp's async runtime. schemars drives JSON Schema in tools/list.
# Versions pinned in [workspace.dependencies]; referenced here as workspace = true.
rmcp = { workspace = true }
tokio = { workspace = true }
schemars = { workspace = true }

[[test]]
name = "mcp_test"
required-features = []

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
walkdir = "2"
codelore-lib = { path = "../codelore-lib", version = "0.29.1", features = ["test-support"] }
