# Quality gates for CodeLore's own repository — evaluated by `codelore check`
# in CI on every push and pull request. Ceilings sit above today's worst
# measured values so the gates bind on regressions, not on the status quo;
# floors sit just below today's worst file.

[gates]
# Worst file today: crates/codelore-cli/src/main.rs at ~35 — the CLI entry
# point and shared dispatch, now that every subcommand lives in its own
# module. The floor tracks the worst file with a margin below its measured
# score: the churn terms in the composite move with every nearby commit, so a
# floor inside the metric's day-to-day noise band flags routine merges rather
# than real decay.
code_health_min = 32.5
# Worst hotspot-row cognitive complexity today: 40 (import_graph.rs) — the
# per-file MAX over its functions. The SPA drawer builds each detail section
# through its own small function, so the drawer file's largest single function
# is its radar renderer at 28 — below today's worst, and far below this
# ceiling. The ceiling sits well above the measured worst and is a candidate
# to tighten in a separate gate retune.
cognitive_max = 150.0
# Corpus-anchored hotspot ceiling, replacing the repo-relative hotspot_score_max
# whose denominator moved every time the worst file changed (improving the worst
# file inflated every other file's score, so the ceiling could only ever track
# "the worst we currently measure"). The anchored score ranks each file's
# cognitive complexity against the calibration corpus for its language —
# conditioned on the corpus's NON-TRIVIAL tail, so a real file's complexity is
# spread across the informative upper percentiles instead of saturating a
# mostly-zero distribution — with only the churn term left repo-relative.
# Improving the worst file in place — dropping its complexity — therefore
# leaves every other file's anchored score unchanged, because the cognitive term
# is corpus-anchored. The revisions term stays repo-relative by design, so a
# change to the revision population itself (a new file clearing min_revs, or a
# refactor commit that reorders the churn ranks) CAN still move an untouched
# file's score; this ceiling carries margin above the measured worst to absorb
# that rather than tracking it exactly — an absolute standard, not a moving
# target held to the last decimal.
#
# Highest anchored score today: 9.08 (crates/codelore-cli/src/main.rs), the
# heavily-changed CLI entry point; the runner-up sits at 8.48, so the worst is a
# clear outlier. The ceiling sits just above that worst (the same ~1.4% margin
# the pre-tail 9.9/9.76 pair carried); it binds when a file grows both hotter and
# more complex against the corpus, and its margin absorbs the repo-relative
# churn-rank movement a refactor of the current worst offender produces.
hotspot_anchored_max = 9.2
# Exactly one import cycle exists (the nine-file codelore-rca cluster).
# Introducing a second cycle fails the gate.
max_dependency_cycles = 1
# Propagation cost today: 0.0131 — a change reaches ~1.3% of the system
# (computed over all 308 live source files, isolated files included).
max_propagation_cost = 0.10
# Share of window churn landing in red-band files, as a share of the
# code-health-banded (scorable) churn only — non-code churn (lockfiles,
# docs, config) is outside both numerator and denominator, so the ratio
# measures concentration within the code that health scoring can see.
# Health-improving churn is exempt: each red file's window churn is
# classified by its own net health movement, and only the degrading share
# counts against the ceiling (both numbers are disclosed in the gate
# message). Degrading share today on this basis: ~29% — the campaign's
# red-file refactors still dominate the window. The ceiling tracks that
# measured worst with margin; revisit toward a corrected steady state once
# the campaign churn rolls out of the window.
max_red_effort_pct = 30.0
red_effort_exempt_improving = true

[diff]
# A pull request may not introduce a new import cycle.
no_new_cycles = true
