[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",  # webpki-roots (transitive via gix HTTP transports)
    "GPL-3.0-only",  # our own crates (SPDX canonical form)
]
confidence-threshold = 0.93

# Build-only codegen dependency of headless_chrome (browser-tests feature).
# Emits Rust source at build time from the Chrome DevTools Protocol JSON; not
# linked into any shipped binary. Only pulled when the `browser-tests` feature
# is enabled, which today is exclusively the spa-browser CI job.
[[licenses.exceptions]]
name = "auto_generate_cdp"
allow = ["GPL-3.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
