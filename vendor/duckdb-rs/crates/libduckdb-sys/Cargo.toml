[package]
name = "libduckdb-sys"
version = "1.10503.1"
authors = ["DuckDB Labs and contributors", "wangfenjin <wangfenj@gmail.com>"]
license = "MIT"
repository = "https://github.com/duckdb/duckdb-rs"
homepage = "https://github.com/duckdb/duckdb-rs"
keywords = ["duckdb", "database", "ffi"]
readme = "README.md"
build = "build.rs"
# `links = "duckdb"` lets the build script publish metadata
# (`cargo:include`, `cargo:lib_dir`) that downstream crates can read
# via `DEP_DUCKDB_*` environment variables in their own build scripts.
# Required for crates that need to compile their own C/C++ code that
# `#include "duckdb.hpp"` against the bundled headers.
links = "duckdb"
categories = ["external-ffi-bindings", "database"]
description = "Native bindings to the libduckdb library, C API"
exclude = ["duckdb-sources"]
edition = "2024"
rust-version = "1.85.1"
[features]
default = ["vcpkg", "pkg-config"]
bundled = ["cc"]
# Warning: experimental feature
bundled-cmake = ["bundled", "dep:cmake", "dep:which", "parquet"]
buildtime_bindgen = ["bindgen", "pkg-config", "vcpkg"]
json = ["bundled"]
parquet = ["bundled"]
autocomplete = ["bundled-cmake"]
icu = ["bundled-cmake"]
tpcds = ["bundled-cmake"]
tpch = ["bundled-cmake"]
extensions-full = ["json", "parquet"]
winduckdb = []
# Warning: experimental feature
loadable-extension = ["prettyplease", "quote", "syn"]

[build-dependencies]
bindgen = { version = "0.72.1", default-features = false, features = ["runtime"], optional = true }
cc = { version = "1.0", features = ["parallel"], optional = true }
cmake = { version = "0.1", optional = true }
flate2 = { version = "1.0" }
pkg-config = { version = "0.3.24", optional = true }
prettyplease = { version = "0.2.20", optional = true }
quote = { version = "1.0.21", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
syn = { version = "2.0.15", optional = true }
tar = { version = "0.4.38" }
vcpkg = { version = "0.2", optional = true }
which = { version = "8", optional = true }
zip = { version = "6", default-features = false, features = ["deflate"] }

[dev-dependencies]
arrow = { version = "58", default-features = false, features = ["ffi"] }